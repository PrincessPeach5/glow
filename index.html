<style>

// ---------- session builder ----------
function restFor(w){var m={steady:1,push:.6,beast:.3}[S.settings.intensity]||1;return w.cat==="stretch"?Math.max(5,w.rest):Math.max(5,Math.round(w.rest*m))}
function buildSession(w,len){
  var rest=restFor(w),n=w.ex.length,sum=w.ex.reduce(function(a,e){return a+(+e.secs||30)},0),R=1,s=1;
  if(w.fit!==false){var T=len*60;R=Math.max(1,Math.round(T/(sum+n*rest)));s=clamp((T-(R*n-1)*rest)/(R*sum),.6,1.6)}else R=Math.max(1,+w.rounds||1);
  var st=[{t:"ready",secs:8}];
  for(var r=0;r<R;r++)for(var j=0;j<n;j++){var e=w.ex[j];st.push({t:"work",ex:e,secs:Math.max(15,Math.round((+e.secs||30)*s/5)*5),r:r,j:j,R:R,n:n});if(!(r===R-1&&j===n-1))st.push({t:"rest",secs:rest})}
  return {steps:st,total:st.reduce(function(a,x){return a+x.secs},0)};
}
function estMin(w,len){return Math.round(buildSession(w,len).total/60)}
function slotLen(s){var L=ensureToday();return (L.plen&&L.plen[s])||L.len||7}

// ---------- player ----------
function startPlayer(wid,slot,len){
  var w=S.workouts[wid];if(!w)return;unlock();closeSheet();
  var b=buildSession(w,len);P={w:w,wid:wid,slot:slot,len:len,steps:b.steps,total:b.total,i:0,end:Date.now()+b.steps[0].secs*1000,paused:false,last:-1,day:today()};
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){WL=l}).catch(function(){})}catch(e){}
  document.getElementById("player").classList.add("on");speak("Get ready. First: "+b.steps[1].ex.name);beep(660,.15);drawPlayer();
}
function curStep(){return P.steps[P.i]}
function nextUp(i){for(var j=i+1;j<P.steps.length;j++)if(P.steps[j].t==="work")return P.steps[j];return null}
function advance(silent){
  P.i++;if(P.i>=P.steps.length){finishPlayer();return}
  var st=curStep();P.end+=st.secs*1000;P.last=-1;
  if(!silent){if(st.t==="work"){beep(988,.12);beep(1319,.2,.14);vib(200);speak(st.ex.name)}else{beep(523,.25);var nx=nextUp(P.i);speak("Rest. Next, "+(nx?nx.ex.name:""))}}
}
function ptick(){
  if(!P||P.paused)return;var now=Date.now(),g=0;
  while(P&&now>=P.end&&g++<300)advance(now-P.end>1500);
  if(!P)return;var rem=Math.ceil((P.end-now)/1000);
  if(rem!==P.last){P.last=rem;if(rem<=3&&rem>=1&&curStep().secs>4)beep(rem===1?784:600,.1);drawPlayer()}
}
function drawPlayer(){
  if(!P)return;var st=curStep(),el=document.getElementById("player"),rem=P.paused?P.rem:Math.max(0,Math.ceil((P.end-Date.now())/1000));
  el.classList.toggle("rest",st.t==="rest");el.classList.toggle("ready",st.t==="ready");
  var e=st.t==="work"?st.ex:nextUp(P.i).ex,nx=st.t==="work"?nextUp(P.i):null;
  var done=0;for(var j=0;j<P.i;j++)done+=P.steps[j].secs;done+=st.secs-rem;
  var C=2*Math.PI*120,frac=st.secs?rem/st.secs:0;
  var head=st.t==="work"?"Round "+(st.r+1)+" of "+st.R+" · Move "+(st.j+1)+" of "+st.n:(st.t==="rest"?"Rest · up next":"Get ready · first up");
  el.innerHTML='<div class="row"><div class="tiny" style="color:#fff;opacity:.8">'+esc(P.w.name)+' · '+Math.round(P.total/60)+' min</div><button class="nf ib" style="background:rgba(255,255,255,.16);color:#fff" data-a="pEnd">✕</button></div>'+
   '<div class="pbar" style="margin-top:8px"><i style="width:'+Math.min(100,done/P.total*100)+'%"></i></div>'+
   '<div class="pmeta" style="margin-top:12px;opacity:.85;font-size:14px">'+head+'</div>'+
   '<div class="pring"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="120" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/><circle cx="130" cy="130" r="120" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-frac))+'"/></svg><div class="t">'+rem+'</div></div>'+
   '<div class="pname">'+(st.t==="rest"?"Rest":"")+(st.t==="rest"?'<div style="font-size:20px;opacity:.85;margin-top:4px">Next: '+esc(e.name)+'</div>':esc(e.name))+'</div>'+

}

function ie(t){return String(t).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n")}
function fold(l){var o="";while(l.length>73){o+=l.slice(0,73)+"\r\n ";l=l.slice(73)}return o+l}
function icsText(cfg){
  cfg=cfg||{slots:S.slots,days:S.days,walkOn:S.settings.walkOn,walkCheck:S.settings.walkCheck,goal:S.settings.goal,grace:S.settings.grace};
  var now=new Date(),stamp=now.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),seq=Math.floor(now.getTime()/1000)%100000,L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Glow//Wiley//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Glow"];
  function ev(uid,days,time,len,sum,desc,alarms){
    if(!days.length)return;var d=new Date();d.setSeconds(0,0);var t=tmin(time);d.setHours(Math.floor(t/60),t%60);
    for(var g=0;g<8&&days.indexOf(d.getDay())<0;g++)d.setDate(d.getDate()+1);

    alarms.forEach(function(a){L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+ie(a[1]),"TRIGGER"+(a[0]<0?";RELATED=START:-PT"+(-a[0])+"M":":PT"+a[0]+"M"),"END:VALARM")});
    L.push("END:VEVENT");
  }
  cfg.slots.forEach(function(sl,i){var ds=[],mx=5;for(var d=0;d<7;d++)if(cfg.days[d].type==="full"){ds.push(d);mx=Math.max(mx,cfg.days[d].len)}
    ev("glow-slot"+(i+1),ds,sl.time,mx,"Glow: "+sl.label+" workout","Time for your "+sl.label.toLowerCase()+" toning workout. Open Glow and press Start.",[[0,"Glow: "+sl.label+" workout now"],[cfg.grace||15,"Glow: you are late. Start your workout now."]])});
  if(cfg.walkOn){var wd=[];for(var d=0;d<7;d++)if(cfg.days[d].type!=="off")wd.push(d);ev("glow-walk",wd,cfg.walkCheck,5,"Glow: Did you walk "+fmi(cfg.goal)+" miles?","Check your walking pad miles in Glow.",[[0,"Glow: walking check. "+fmi(cfg.goal)+" miles today?"]])}
  L.push("END:VCALENDAR");return L.map(fold).join("\r\n")+"\r\n";
}

  o+='<label class="f">Miles walked</label><div class="row"><button class="ib nf" data-a="fixMi" data-k="'+k+'" data-v="-0.25">−</button><div style="text-align:center;font-size:24px">'+fmi(L.miles)+' / '+fmi(L.goal)+'</div><button class="ib nf" data-a="fixMi" data-k="'+k+'" data-v="0.25">＋</button><button class="ib nf" data-a="fixMi" data-k="'+k+'" data-v="1">+1</button></div>';
  if(L.type==="full")[0,1,2].forEach(function(s){o+='<div class="tog"><div><b>'+esc(S.slots[s].label)+'</b><div class="tiny">'+esc((S.workouts[(L.done[s]&&L.done[s].wid)||L.pick[s]]||{}).name||"")+'</div></div>'+sw(!!L.done[s],"fixSlot",' data-k="'+k+'" data-s="'+s+'"')+'</div>'});
  o+='<label class="f">Day type</label>'+seg([["full","Workouts"],["walk","Walk only"],["off","Rest"]],L.type,"fixType",' data-k="'+k+'"');
  openSheet(o);
}

// ---------- actions ----------
var A={
  tab:function(e){UI.tab=e.dataset.v;window.scrollTo(0,0);render()},
  closeSheet:closeSheet,
  welcomeOff:function(){S.welcome=false;save();render()},
  mi:function(e){var L=ensureToday(),was=walkOk(L);L.miles=Math.max(0,r2(L.miles+(+e.dataset.v)));save();if(!was&&walkOk(L)){confetti();toast("Walking goal hit! 👟")}render()},
  miSet:function(){var L=ensureToday(),v=prompt("Miles walked today?",L.miles);if(v==null)return;v=parseFloat(v);if(isNaN(v)||v<0||v>40)return toast("Enter a number like 3.2");var was=walkOk(L);L.miles=r2(v);save();if(!was&&walkOk(L))confetti();render()},
  start:function(e){var s=+e.dataset.s,L=ensureToday();startPlayer(L.pick[s],s,slotLen(s))},
  snooze:function(e){var k=today();(S.alerts[k]=S.alerts[k]||{})[e.dataset.s]=Date.now()+600000;save();closeSheet();toast("I will remind you in 10 minutes")},
  plen:function(e){var L=ensureToday();L.plen=L.plen||[];L.plen[+e.dataset.s]=+e.dataset.v;save();render()},
  shuffle:function(e){var s=+e.dataset.s,L=ensureToday(),day=S.days[dow(today())],c=cands(day.picks[s]);if(c.length<2)c=cands("g:"+(S.workouts[L.pick[s]].cat==="stretch"?"stretch":"any"));
    var a=c.filter(function(i){return L.pick.indexOf(i)<0});if(!a.length)a=c;L.pick[s]=a[Math.floor(Math.random()*a.length)];save();render();toast("🎲 "+S.workouts[L.pick[s]].name)},
  mark:function(e){var s=+e.dataset.s,L=ensureToday();if(L.done[s]){if(confirm("Undo this workout?")){L.done[s]=null;save();render()}return}
    if(confirm("Mark your "+S.slots[s].label.toLowerCase()+" workout done without the timer? Only if you really did it.")){L.done[s]={at:Date.now(),wid:L.pick[s],min:slotLen(s),manual:true};save();if(fAll(today())===true)confetti();render()}},
  wd:function(e){wDetail(e.dataset.id,e.dataset.s!=null?+e.dataset.s:null)},
  dLen:function(e){UI.dLen=+e.dataset.v;e.parentNode.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b===e)})},
  dStart:function(e){var s=e.dataset.s!=null?+e.dataset.s:-1,id=e.dataset.id,L=ensureToday();if(s>=0&&L.pick[s]!==id)s=-1;if(s>=0&&L.done[s])s=-1;startPlayer(id,s,UI.dLen||7)},
  swapIn:function(e){var L=ensureToday(),s=+e.dataset.s;if(L.done[s])return;L.pick[s]=e.dataset.id;save();closeSheet();UI.tab="today";render();toast("Added to "+S.slots[s].label)},
  surprise:function(){var ids=cands("g:any"),lu=usedMap(),L=ensureToday();ids=ids.filter(function(i){return L.pick.indexOf(i)<0});ids.sort(function(a,b){return (lu[a]||"")<(lu[b]||"")?-1:1});var pool=ids.slice(0,Math.max(5,Math.ceil(ids.length/3)));wDetail(pool[Math.floor(Math.random()*pool.length)])},
  cat:function(e){UI.cat=e.dataset.v;render()},
  wNew:function(){ED={_new:true,id:"my"+Date.now().toString(36),name:"My workout",cat:"full",desc:"My own workout.",rest:12,fit:true,rounds:2,ex:[{name:"Plié squat pulses",secs:40,reps:"20",wt:"bw",cue:""},{name:"Bicep curl",secs:40,reps:"15",wt:"8",cue:""}]};edSheet()},
  wEdit:function(e){ED=JSON.parse(JSON.stringify(S.workouts[e.dataset.id]));edSheet()},
  wCopy:function(e){var w=JSON.parse(JSON.stringify(S.workouts[e.dataset.id]));w.id="my"+Date.now().toString(36);w.name+=" (my version)";w.preset=false;ED=w;ED._new=true;edSheet()},
  wDel:function(e){var id=e.dataset.id,w=S.workouts[id];if(Object.keys(S.workouts).length<4)return toast("Keep at least a few workouts");if(!confirm((w.preset?"Hide ":"Delete ")+w.name+"?"))return;delete S.workouts[id];if(w.preset){S.deleted=S.deleted||{};S.deleted[id]=1}
    S.days.forEach(function(d){d.picks=d.picks.map(function(p){return p==="w:"+id?"g:any":p})});var L=ensureToday();if(L.pick.indexOf(id)>=0)ensureToday(true);save();closeSheet();render()},
  exAdd:function(){ED.ex.push({name:"",secs:40,reps:"15",wt:"bw",cue:""});edSheet()},
  exDel:function(e){if(ED.ex.length<2)return toast("A workout needs at least one move");ED.ex.splice(+e.dataset.i,1);edSheet()},
  exUp:function(e){var i=+e.dataset.i;if(i>0){var t=ED.ex[i];ED.ex[i]=ED.ex[i-1];ED.ex[i-1]=t}edSheet()},
  edSave:function(){var w=ED;w.name=(w.name||"").trim()||"My workout";w.ex=w.ex.filter(function(x){return (x.name||"").trim()});if(!w.ex.length)return toast("Add at least one move");
    w.ex.forEach(function(x){x.secs=clamp(Math.round(+x.secs||30),5,300);var m=null;for(var k in X)if(X[k][0].toLowerCase()===x.name.trim().toLowerCase())m=X[k];if(m&&!x.cue)x.cue=m[2]});w.rest=clamp(Math.round(+w.rest||0),0,120);
    var isNew=w._new;delete w._new;S.workouts[w.id]=w;save();closeSheet();if(isNew){UI.cat="mine"}render();toast("Saved ✓")},
  edReset:function(){var p=presetWorkouts()[ED.id];if(p&&confirm("Reset to the original version?")){S.workouts[ED.id]=p;save();closeSheet();render()}},
  dayType:function(e){S.days[+e.dataset.d].type=e.dataset.v;dayChanged(+e.dataset.d)},
  dayLen:function(e){S.days[+e.dataset.d].len=+e.dataset.v;dayChanged(+e.dataset.d)},
  goal:function(e){var g=clamp(r2(S.settings.goal+(+e.dataset.v)),3,20);S.settings.goal=g;var L=ensureToday();L.goal=g;save();render()},
  buildOn:function(){S.settings.build.on=!S.settings.build.on;save();render()},
  buildStep:function(e){S.settings.build.step=+e.dataset.v;save();render()},
  buildNeed:function(e){S.settings.build.need=+e.dataset.v;save();render()},
  levelUp:function(){var B=S.settings.build;S.settings.goal=r2(S.settings.goal+B.step);B.asked=weekStart(today());ensureToday().goal=S.settings.goal;save();confetti();render();toast("New goal: "+fmi(S.settings.goal)+" miles")},
  levelNo:function(){S.settings.build.asked=weekStart(today());save();render()},
  inten:function(e){S.settings.intensity=e.dataset.v;save();render()},
  toneSet:function(e){S.settings.tone=e.dataset.v;save();render()},
  grace:function(e){S.settings.grace=+e.dataset.v;save();render()},
  nag:function(e){S.settings.nag=+e.dataset.v;save();render()},
  set:function(e){var k=e.dataset.k;S.settings[k]=!S.settings[k];save();render()},
  perm:function(){unlock();if(!("Notification" in window)){openSheet('<h2>Alerts inside Glow</h2><p>This browser does not support notifications. On iPhone, open Glow from the home screen icon (not Safari) on iOS 16.4 or newer. Glow will still beep and show a full-screen alert while it is open.</p>');return}
    Notification.requestPermission().then(function(){render();if(Notification.permission==="granted")notify("Glow alerts are on","You will get alerts while Glow is open.")})},
  testAlarm:function(){unlock();var L=ensureToday();var s=order().filter(function(x){return !L.done[x]})[0];if(L.type==="full"&&s!=null)showAlarm(s);else showAlarm("w")},
  ics:function(){downloadText("glow-reminders.ics",icsText(),"text/calendar;charset=utf-8");S.settings.calDone=true;save();
    openSheet('<h2>📅 Add to Calendar</h2><ol><li>iPhone shows the Glow events. Tap <b>Add All</b>, then pick a calendar (an empty one named Glow makes them easy to delete later).</li><li>You will get an alert at each workout time, again '+S.settings.grace+' minutes later if you are late, and a walking check at '+fmtT(S.settings.walkCheck)+(S.settings.walkOn?'':' (off)')+'.</li><li>If you change your times or days, tap the button again and delete the old Glow events.</li></ol><p class="sub">If nothing popped up, tap “Not working? Other ways” in the Me tab.</p><button class="btn" data-a="closeSheet">Done</button>');render()},
  icsHelp:function(){openSheet('<h2>Other ways to add reminders</h2><p class="sub">Some iPhones will not open calendar files from a home-screen app. Copy this link, paste it into <b>Safari</b>, and tap the button there. It carries your current times.</p><input type="text" readonly value="'+esc(calLink())+'" onclick="this.select()"><button class="btn" data-a="copyLink" style="margin-top:8px">Copy link</button><p class="sub" style="margin-top:12px">Or set three repeating alarms in the Clock app at '+S.slots.map(function(s){return fmtT(s.time)}).join(", ")+'.</p>')},
  copyLink:function(){var t=calLink();if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("Link copied")},function(){toast("Press and hold the link to copy")});else toast("Press and hold the link to copy")},
  icsFromLink:function(){try{var cfg=JSON.parse(atob(decodeURIComponent(location.hash.slice(5))));downloadText("glow-reminders.ics",icsText(cfg),"text/calendar;charset=utf-8")}catch(e){toast("That link is broken")}},
  export:function(){downloadText("glow-backup-"+today()+".json",JSON.stringify(S),"application/json")},
  import:function(){$("#imp").click()},
  reset:function(){if(confirm("Erase all Glow data on this phone?")&&confirm("Really? This cannot be undone.")){localStorage.removeItem(KEY);load();save();render()}},
  dayFix:function(e){dayFix(e.dataset.k)},
  fixMi:function(e){var L=S.log[e.dataset.k];L.miles=Math.max(0,r2(L.miles+(+e.dataset.v)));save();dayFix(e.dataset.k);render()},
  fixSlot:function(e){var L=S.log[e.dataset.k],s=+e.dataset.s;L.done[s]=L.done[s]?null:{at:Date.now(),wid:L.pick[s],min:L.len||7,manual:true};save();dayFix(e.dataset.k);render()},
  fixType:function(e){S.log[e.dataset.k].type=e.dataset.v;save();dayFix(e.dataset.k);render()},
  pPause:function(){unlock();if(P.paused){P.paused=false;P.end=Date.now()+P.rem*1000}else{P.paused=true;P.rem=Math.max(1,Math.ceil((P.end-Date.now())/1000))}drawPlayer()},
  pSkip:function(){if(P.paused){P.paused=false}P.end=Date.now();advance(false);if(P){P.end=Date.now()+curStep().secs*1000;drawPlayer()}},
  pBack:function(){var st=curStep(),el=st.secs-Math.ceil((P.end-Date.now())/1000);if(el<3&&P.i>0){P.i--;if(curStep().t==="rest"&&P.i>0)P.i--}P.paused=false;P.end=Date.now()+curStep().secs*1000;P.last=-1;drawPlayer()},
  pEnd:function(){if(!P)return;var was=P.paused;if(!was){P.paused=true;P.rem=Math.max(1,Math.ceil((P.end-Date.now())/1000))}
    if(confirm("Quit this workout? It will not count.")){P=null;document.getElementById("player").classList.remove("on");try{WL&&WL.release();WL=null}catch(e){}render()}else if(!was){P.paused=false;P.end=Date.now()+P.rem*1000;drawPlayer()}}
};
function dayChanged(d){if(dow(today())===d){var L=ensureToday();if(L.done.every(function(x){return !x}))ensureToday(true);else{L.type=S.days[d].type;L.len=S.days[d].len}}save();render()}
var C={
  slotLabel:function(e){S.slots[+e.dataset.i].label=e.value.trim()||"Workout";save()},
  slotTime:function(e){if(!e.value)return;S.slots[+e.dataset.i].time=e.value;var k=today();if(S.alerts[k])delete S.alerts[k][e.dataset.i];save();render()},
  dayPick:function(e){S.days[+e.dataset.d].picks[+e.dataset.s]=e.value;dayChanged(+e.dataset.d)},
  walkCheck:function(e){if(e.value){S.settings.walkCheck=e.value;save()}},
  ed:function(e){var f=e.dataset.f;if(f==="fitR"){if(e.value==="fit")ED.fit=true;else{ED.fit=false;ED.rounds=+e.value}}else ED[f]=f==="rest"?+e.value:e.value},
  ex:function(e){var x=ED.ex[+e.dataset.i],f=e.dataset.f;x[f]=f==="secs"?+e.value:e.value;if(f==="name"){for(var k in X)if(X[k][0]===e.value){x.wt=X[k][1];x.cue=X[k][2];var sel=document.querySelector('select[data-c=ex][data-i="'+e.dataset.i+'"]');if(sel)sel.value=x.wt}}}
};
document.addEventListener("click",function(ev){unlock();if(ev.target.id==="modal"){closeSheet();return}var e=ev.target.closest("[data-a]");if(!e)return;if(e.id==="modal"&&ev.target!==e)return;var f=A[e.dataset.a];if(f){ev.preventDefault();f(e)}});
document.addEventListener("input",function(ev){var e=ev.target.closest("[data-c]");if(e&&C[e.dataset.c]&&(e.dataset.c==="ed"||e.dataset.c==="ex"||e.dataset.c==="slotLabel"))C[e.dataset.c](e)});
document.addEventListener("change",function(ev){var e=ev.target;if(e.id==="imp"){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.v!==3||!d.workouts)throw 0;if(confirm("Replace everything with this backup?")){S=d;save();render();toast("Restored")}}catch(x){toast("That is not a Glow backup")}};if(e.files[0])r.readAsText(e.files[0]);e.value="";return}
  e=e.closest("[data-c]");if(e&&C[e.dataset.c])C[e.dataset.c](e)});
document.addEventListener("visibilitychange",function(){if(!document.hidden){render();checkAlerts();if(P&&!WL&&navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){WL=l}).catch(function(){})}});

// ---------- boot ----------
function icsPage(){if(location.hash.indexOf("#ics=")!==0)return false;closeSheet();$("#app").innerHTML='<header><div><h1>Glow reminders</h1></div></header><main><div class="card"><p>Tap below to add your Glow workout reminders to Calendar.</p><button class="btn" data-a="icsFromLink">📅 Add reminders to Calendar</button></div><a class="btn ghost" style="display:block;text-align:center;text-decoration:none;line-height:24px" href="./">Open Glow</a></main>';return true}
function boot(){
  load();ensureToday();save();
  window.addEventListener("hashchange",function(){if(icsPage())return;render()});
  if(icsPage())return;
  render();
  setInterval(function(){if(P){ptick();return}var c=$("#cd");if(c){var t=+c.dataset.t,l=nowMin()-t,g=S.settings.grace;var stt=l<0?0:l>g?2:1;c.textContent=stt===0?"starts in "+cdText(-l):stt===2?Math.round(l)+" min late":"go now";if(String(stt)!==c.dataset.st)render()}},250);
  var LD=dk();setInterval(function(){if(dk()!==LD){LD=dk();ensureToday();render()}checkAlerts()},15000);
  setTimeout(checkAlerts,1200);
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").then(function(){return navigator.serviceWorker.ready}).then(function(r){SW=r}).catch(function(){});
}
boot();
