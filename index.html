header{padding:calc(18px + env(safe-area-inset-top)) 20px 6px}
.sub{color:var(--soft);font-size:14px}
main{padding:0 16px}

.count{background:linear-gradient(135deg,#f3e1da,#fbf1ec);text-align:center}

button{font:inherit;border:0;cursor:pointer}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.opt{background:#f8f0ec;border:1.5px solid transparent;border-radius:14px;padding:12px 14px;min-height:48px;flex:1 1 40%;color:var(--ink)}
.opt.on{border-color:var(--rose);background:#fff;color:var(--deep);font-weight:600}
.goal{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border:0}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--blush);flex:none;display:grid;place-items:center;background:#fff;color:#fff;font-size:18px}

function fastCard(){return `<div class="card"><h2>Better fast-food orders</h2><p class="sub">For the days it's that or nothing — eating something always beats skipping.</p>${FAST.map(f=>`<div class="meal"><small>${f[0]}</small>${f[1]}</div>`).join('')}</div>`}
function grocery(){const map={};S.meals.plan.forEach(d=>{[d.b,d.l,d.d].forEach(m=>(m.it||[]).forEach(i=>map[i[0]]=i[1]));
  const sn=typeof d.s==='string'?SNACKS.find(s=>s.n===d.s):d.s;(sn&&sn.it||[]).forEach(i=>map[i[0]]=i[1])});
 const order=['Produce','Meat','Deli','Dairy','Bakery','Frozen','Pantry'];return Object.entries(map).sort((a,b)=>order.indexOf(a[1])-order.indexOf(b[1])||a[0].localeCompare(b[0]))}
const MQ_DEF={proteins:[],seafood:'yes',cuisine:[],vegLike:[],vegNo:[],bfast:'sweet',carbs:[],snack:[],out:2,prep:'some',eq:['micro','stove','oven'],allergy:[],time:20,budget:2};
function mealQuiz(){const p=S.meals.prefs;window._mq=Object.assign(JSON.parse(JSON.stringify(MQ_DEF)),p&&p.proteins?JSON.parse(JSON.stringify(p)):{});mealQ()}
function mealQ(){const q=window._mq;
 const tog=(k,v,l)=>`<button class="opt ${q[k].includes(v)?'on':''}" data-mqm="${k}" data-v="${v}">${l}</button>`,one=(k,v,l)=>`<button class="opt ${q[k]==v?'on':''}" data-mq1="${k}" data-v="${v}">${l}</button>`;
 const sec=(t,h,s)=>`<h3>${t}</h3>${s?`<p class="sub" style="margin:0">${s}</p>`:''}<div class="opts">${h}</div>`;
 const VEG=[['broccoli','Broccoli'],['spinach','Spinach'],['peppers','Bell peppers'],['carrots','Carrots'],['cucumber','Cucumber'],['tomatoes','Tomatoes'],['lettuce','Lettuce'],['greenbeans','Green beans'],['onions','Onions'],['avocado','Avocado'],['berries','Berries']];
 openSheet(`<button class="x" data-act="close">×</button><h2>Meal quiz</h2><p class="sub">Tap everything that fits — about 2 minutes.</p>
 ${sec('Proteins you like',[['chicken','Chicken'],['turkey','Turkey'],['beef','Beef'],['pork','Pork'],['salmon','Salmon'],['shrimp','Shrimp'],['tuna','Tuna'],['eggs','Eggs'],['tofu','Tofu'],['yogurt','Greek yogurt / cottage cheese'],['beans','Beans']].map(o=>tog('proteins',...o)).join(''),'Pick as many as you like')}
 ${sec('Seafood?',one('seafood','yes','Yes, love it')+one('seafood','no','No seafood'))}
 ${sec('Favorite cuisines',[['american','American'],['mexican','Mexican'],['italian','Italian'],['asian','Asian'],['mediterranean','Mediterranean']].map(o=>tog('cuisine',...o)).join(''))}
 ${sec('Veggies you like',VEG.map(o=>tog('vegLike',...o)).join(''))}
 ${sec('Veggies to avoid',VEG.map(o=>tog('vegNo',...o)).join(''))}
 ${sec('Breakfast style',[['sweet','Sweet'],['savory','Savory & hot'],['grab','Grab-and-go'],['smoothie','Smoothie']].map(o=>one('bfast',...o)).join(''))}
 ${sec('Carbs you enjoy',[['rice','Rice'],['pasta','Pasta'],['potatoes','Potatoes'],['tortillas','Tortillas'],['bread','Bread'],['quinoa','Quinoa'],['oats','Oats']].map(o=>tog('carbs',...o)).join(''))}
 ${sec('Snacks you reach for',[['sweet','Sweet'],['savory','Savory'],['grab','On-the-go']].map(o=>tog('snack',...o)).join(''))}
 ${sec('Meals eaten out per week',[[0,'0'],[2,'1-2'],[4,'3-4'],[6,'5+']].map(o=>one('out',...o)).join(''))}
 ${sec('Do you meal-prep?',[['yes','Yes, batch cook'],['some','Sometimes'],['no','No, cook fresh']].map(o=>one('prep',...o)).join(''))}
 ${sec('Kitchen equipment',[['micro','Microwave'],['stove','Stovetop'],['oven','Oven'],['airfryer','Air fryer'],['blender','Blender'],['slowcooker','Slow cooker / Instant Pot']].map(o=>tog('eq',...o)).join(''))}
 ${sec('Allergies / avoid',[['dairy','Dairy'],['gluten','Gluten'],['egg','Eggs'],['nuts','Nuts'],['soy','Soy'],['fish','Fish'],['shellfish','Shellfish'],['sesame','Sesame']].map(o=>tog('allergy',...o)).join(''))}

function mealMake(){const q=window._mq,SEA=['salmon','shrimp','tuna'];
 const al=m=>!m.al.some(a=>q.allergy.includes(a))&&!(m.p==='eggs'&&q.allergy.includes('egg'))&&!(m.p==='tofu'&&q.allergy.includes('soy'));
 const protOK=m=>!(q.seafood==='no'&&SEA.includes(m.p))&&(!q.proteins.length||q.proteins.includes(m.p)||(m.p==='yogurt'||m.p==='beans')&&!q.proteins.length);
 const eqOK=m=>!m.eq.length||m.eq.some(e=>q.eq.includes(e));
 const vegOK=m=>!m.veg.some(v=>q.vegNo.includes(v));
 const score=m=>(q.cuisine.includes(m.cu)?3:0)+m.veg.filter(v=>q.vegLike.includes(v)).length+(q.carbs.includes(m.carb)?2:0)+(q.proteins.includes(m.p)?2:0)+(m.m==='b'&&m.tags.includes(q.bfast)?4:0)+(q.prep==='yes'&&m.tags.includes('prep')?2:0)+((seedNum()*7+m.n.length)%3)*.1;
 const pool=t=>{const base=MEALS.filter(m=>m.m===t&&al(m)&&q.seafood!=='no'||m.m===t&&al(m)&&!SEA.includes(m.p));
  const tiers=[m=>protOK(m)&&eqOK(m)&&vegOK(m)&&m.min<=q.time&&m.c<=q.budget,m=>protOK(m)&&eqOK(m)&&vegOK(m),m=>protOK(m)&&eqOK(m),m=>eqOK(m),()=>true];
  for(const f of tiers){const p=base.filter(f);if(p.length>=(t==='b'?2:3))return p.sort((a,b)=>score(b)-score(a))}
  return (base.length?base:MEALS.filter(m=>m.m===t)).sort((a,b)=>score(b)-score(a))};
 const B=pool('b'),L=pool('l'),D=pool('d');
 let SN=SNACKS.filter(s=>!s.al.some(a=>q.allergy.includes(a)));if(!SN.length)SN=SNACKS;
 if(q.snack.length){const f=SN.filter(s=>s.t.some(t=>q.snack.includes(t)));if(f.length)SN=f}
 const plan=[];let di=0;
 for(let i=0;i<7;i++){
  let d;if(q.prep==='yes'){d=D[Math.floor(i/2)%D.length]}else{d=D[di++%D.length]}
  let l;if(q.prep!=='no'&&i>0&&plan[i-1].d&&!plan[i-1].d.out&&(q.prep==='yes'||i%2)){l=Object.assign({},plan[i-1].d,{n:'Leftover '+plan[i-1].d.n.charAt(0).toLowerCase()+plan[i-1].d.n.slice(1),left:1,it:[]})}else l=L[i%L.length];
  plan.push({b:B[i%Math.min(B.length,q.bfast==='grab'||q.bfast==='smoothie'?2:3)],l,d,s:SN[i%SN.length]});
 }
 // eating out: replace lunches/dinners on busiest days
 const slots=[[1,'l'],[3,'l'],[4,'d'],[5,'d'],[0,'l'],[2,'l'],[6,'l']];
 let FF=FAST.filter(f=>q.cuisine.includes(f[2]));if(FF.length<2)FF=FAST;
 for(let k=0;k<Math.min(q.out,slots.length);k++){const [i,t]=slots[k],f=FF[k%FF.length];plan[i][t]={n:f[0]+': '+f[1],m:t,min:0,pro:30,out:1,it:[]};
  if(t==='d'&&i<6&&plan[i+1].l.left)plan[i+1].l=L[(i+1)%L.length]}
 S.meals={prefs:q,plan,got:{}};save();closeSheet();window._md=undefined;go('meals')}
function lastDays(n){const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push([dkey(d),S.days[dkey(d)]])}return a}
function streak(){let s=0;for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);const x=S.days[dkey(d)];const n=x&&x.done?Object.keys(x.done).length:0;if(n>=3)s++;else if(i>0)break}return s}
function chart(series,max,labels){const W=320,H=120,n=labels.length,X=i=>n>1?i*(W-20)/(n-1)+10:W/2;let s=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%">`;
 for(let g=0;g<=2;g++)s+=`<line x1="0" x2="${W}" y1="${10+g*(H-20)/2}" y2="${10+g*(H-20)/2}" stroke="#f1e6e1"/>`;
 series.forEach(([vals,col])=>{const pts=vals.map((v,i)=>v==null?null:[X(i),H-10-v/max*(H-20)]).filter(Boolean);
  s+=`<polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${col}"/>`)});
 labels.forEach((l,i)=>s+=`<text x="${X(i)}" y="${H+14}" font-size="11" text-anchor="middle" fill="#8c7d78">${l}</text>`);return s+'</svg>'}
function bars(vals,max,labels,col){const W=320,H=110,n=vals.length,bw=(W/n)*.6;let s=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%">`;
 vals.forEach((v,i)=>{const h=max?Math.min(1,(v||0)/max)*(H-10):0,x=i*W/n+(W/n-bw)/2;s+=`<rect x="${x}" y="${H-h}" width="${bw}" height="${h}" rx="5" fill="${col}"/><text x="${x+bw/2}" y="${H+14}" font-size="11" text-anchor="middle" fill="#8c7d78">${labels[i]}</text>`});return s+'</svg>'}
function vTrack(){
 const L=lastDays(7),lab=L.map(([k])=>'SMTWTFS'[new Date(k+'T12:00').getDay()]),ci=f=>L.map(([,x])=>x&&x.checkin?x.checkin[f]:null);
 const s=weekStats(),st=streak(),x=day();
 const allW=Object.entries(S.days).flatMap(([k,x])=>(x.workouts||[]).map(w=>[k,w.n])).slice(-8).reverse();
 const wts=Object.entries(S.days).filter(([,x])=>x.weight).slice(-10);
 const done=L.reduce((a,[,x])=>a+(x&&x.done?Object.keys(x.done).length:0),0);
 return `<div class="card"><div class="grid"><div><div class="sub">Streak</div><h1>${st} day${st===1?'':'s'}</h1></div><div><div class="sub">Goals done (7 days)</div><h1>${done}</h1></div></div><p class="sub">A streak day = 3+ goals checked off.</p></div>
 <div class="card"><h3>Weekly summary</h3><p>${s.w} strength · ${s.o} Orangetheory · ${s.walk} walking min (${s.dog} dog walks) · ${s.rest} mobility. ${s.w+s.o>=3?'You\'re building real consistency.':'Every small session counts. Keep showing up.'}</p></div>
 <div class="card"><h3>Energy, mood &amp; skin</h3><div class="row sub" style="gap:14px"><span style="color:#b9786a">● Energy</span><span style="color:#8fa585">● Mood</span><span style="color:#d9a99b">● Skin</span></div>${chart([[ci('energy'),'#b9786a'],[ci('mood'),'#8fa585'],[ci('skin').map(v=>v==null?null:v*4/3),'#d9a99b']],4,lab)}</div>
 <div class="card"><h3>Water (oz)</h3>${bars(L.map(([,x])=>x?x.water:0),96,lab,'#c9b6d6')}<h3>Steps</h3>${bars(L.map(([,x])=>x?x.steps||0:0),8000,lab,'#e9c9bf')}</div>
 <div class="card"><h3>Dog walks</h3><p class="sub">Log a walk with your pup (counts toward weekly walking). This week: ${s.dog} walk${s.dog===1?'':'s'}.</p><div class="opts">${[10,20,30,45].map(m=>`<button class="opt" data-dog="${m}">+ ${m} min</button>`).join('')}</div>${(x.dogWalks||[]).length?`<p class="sub">Today: ${x.dogWalks.map(w=>w.min+' min').join(', ')}</p>`:''}</div>
 <div class="card"><h3>Workout log</h3>${allW.length?allW.map(w=>`<div class="meal"><small>${w[0]}</small>${w[1]}</div>`).join(''):'<p class="sub">Finish a workout and it shows up here.</p>'}</div>
 <div class="card"><h3>Optional body check-in</h3><p class="sub">Totally optional. Strength and energy are the real wins; the scale may barely move as you build muscle.</p>
 <div class="row"><input type="number" step="0.1" id="wtIn" placeholder="Weight (lb)" value="${x.weight||''}"><input type="text" id="msIn" placeholder="Measurements / notes" value="${x.meas||''}"></div><button class="btn ghost" style="margin-top:8px" data-act="saveBody">Save</button>
 ${wts.length>1?chart([[wts.map(w=>w[1].weight-100),'#b9786a']],30,wts.map(w=>w[0].slice(5))):''}</div>
 <button class="btn ghost" data-act="reset">Reset all data</button>`;
}
function openSheet(h){$('#sheet').innerHTML=h;$('#modal').classList.add('on');$('#sheet').scrollTop=0}
function closeSheet(){$('#modal').classList.remove('on');clearInterval(timerInt)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,input[type=checkbox]');if(!b){if(e.target.id==='modal')closeSheet();return}
 const ds=b.dataset;
 if(ds.tab)return go(ds.tab);
 if(ds.goal){const x=day();if(x.done[ds.goal])delete x.done[ds.goal];else x.done[ds.goal]=1;save();return render()}
 if(ds.water){const x=day();x.water=Math.max(0,x.water+ +ds.water);const g=x.goals&&x.goals.find(g=>g.id==='water');if(g&&x.water>=g.oz)x.done.water=1;save();return render()}
 if(ds.open){if(ds.open==='gym')return gymSheet();if(ds.open==='walk'){const x=day(),g=x.goals.find(g=>g.id==='walk');g.kind=g.kind==='dog'?'pad':'dog';walkText(g);save();return render()}return startWorkout(ds.open.slice(2))}
 if(ds.move)return moveSheet(ds.move);
 if(ds.mf){mfilter=ds.mf;return render()}
 if(ds.md!==undefined){window._md=+ds.md;return render()}
 if(ds.groc){S.meals.got[ds.groc]=b.checked;save();return render()}
 const val=v=>isNaN(v)?v:+v;
 if(ds.q){Q[ds.q]=val(ds.v);return quiz(+ds.i+1)}
 if(ds.qm){const a=Q[ds.qm]=Q[ds.qm]||[],v=val(ds.v);const solo=['none'];if(solo.includes(v)){Q[ds.qm]=a.includes(v)?[]:[v]}else{const i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);Q[ds.qm]=a.filter(x=>!solo.includes(x))}return quiz(+ds.i)}
 if(ds.dog){const x=day();x.dogWalks=x.dogWalks||[];x.dogWalks.push({min:+ds.dog,at:Date.now()});const g=x.goals&&x.goals.find(g=>g.id==='walk');if(g&&g.kind==='dog'&&x.dogWalks.reduce((a,w)=>a+w.min,0)>=g.min)x.done.walk=1;save();return render()}
 if(ds.pk){window._p[ds.pk]=+ds.v;b.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));return}
 if(ds.mqm){const a=window._mq[ds.mqm],v=val(ds.v),i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);b.classList.toggle('on',i<0);return}
 if(ds.mq1){window._mq[ds.mq1]=val(ds.v);b.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));return}
 const A={qNext:()=>quiz(+ds.i+1),close:closeSheet,quiz:()=>quiz(0),planEdit,mealQuiz,mealMake,
  planSave:()=>{S.weeks[wkey()]=window._p;save();closeSheet();render()},
  saveSteps:()=>{const x=day();x.steps=+$('#stepsIn').value||0;const g=x.goals&&x.goals.find(g=>g.id==='steps');if(g&&x.steps>=g.steps)x.done.steps=1;save();render()},
  saveBody:()=>{const x=day();x.weight=+$('#wtIn').value||undefined;x.meas=$('#msIn').value;save();render()},
  tStart:()=>tStart(+ds.sec),wNext:()=>wNext(+ds.sets),
  logGym:()=>{const x=day();x.workouts.push({k:'gym',n:'Campus gym',at:Date.now()});if(x.goals&&x.goals.find(g=>g.kind==='gym'))x.done.workout=1;save();closeSheet();render()},
  reset:()=>{if(confirm('Erase all Glow data on this device?')){localStorage.removeItem('glow');location.reload()}}};
 if(ds.act&&A[ds.act])A[ds.act]();
});
nav();render();
</script></body></html>
