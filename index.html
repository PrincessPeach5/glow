header{padding:calc(18px + env(safe-area-inset-top)) 20px 6px}
.sub{color:var(--soft);font-size:14px}
main{padding:0 16px}

.count{background:linear-gradient(135deg,#f3e1da,#fbf1ec);text-align:center}

button{font:inherit;border:0;cursor:pointer}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.opt{background:#f8f0ec;border:1.5px solid transparent;border-radius:14px;padding:12px 14px;min-height:48px;flex:1 1 40%;color:var(--ink)}
.opt.on{border-color:var(--rose);background:#fff;color:var(--deep);font-weight:600}
.goal{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border:0}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--blush);flex:none;display:grid;place-items:center;background:#fff;color:#fff;font-size:18px}

function weekStats(){
 const m=monday(new Date());let w=0,o=0,walk=0,rest=0;
 for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);const x=S.days[dkey(d)];if(!x||!x.goals)continue;
  const g=x.goals.find(g=>g.id==='workout');

  const wg=x.goals.find(g=>g.id==='walk');if(x.done.walk&&wg)walk+=wg.min}

function genGoals(c){

 const tired=c.sleep<=1||c.energy<=1,sore=c.sore>=3,busy=c.busy>=3,wk=weekNo(),g=[];
 if(c.otf)g.push({id:'workout',kind:'otf',t:'Orangetheory class',d:'That\'s your workout! Eat a snack 1-2 hrs before.',core:1,open:'w:flex'});
 else if(c.gym)g.push({id:'workout',kind:'gym',t:'Campus gym session',d:'~40 min machine circuit',core:1,open:'gym'});
 else if(tired||sore||(ws.w>=plan.workouts&&ws.rest<plan.rest))g.push({id:'workout',kind:'rest',t:'Restore & mobility',d:(tired?'Low-energy day — gentle is smart. ':'')+'~10 min of stretches',core:1,open:'w:mobility'});

 const need=Math.max(0,plan.walk-ws.walk);let wm=Math.round(need/dLeft/5)*5;
 wm=Math.max(10,Math.min(wm||15,45));if(busy||c.otf)wm=Math.min(wm,15);if(tired)wm=Math.min(wm,20);
 g.push({id:'walk',min:wm,t:wm+'-min walking-pad walk',d:busy?'Walk while reviewing flashcards or a lecture':'Brisk, conversational pace',core:1});

 g.push({id:'water',oz:water,t:'Drink '+water+' oz of water',d:'Tap + on the water tracker as you go',core:1});
 g.push({id:'eat',t:'3 meals + 1 snack, ~90 g protein',d:'Protein at every meal. Fuel before you\'re starving.',core:1});
 const stepT=Math.min(8000,2500+500*(wk-1));
 g.push({id:'steps',steps:stepT,t:stepT.toLocaleString()+' steps',d:'Building up gradually from ~2,000',core:busy?0:1});
 g.push({id:'mind',t:pick(MENTAL[c.mood<=2?'low':'ok'],seedNum()),d:'Mental health',core:busy||c.mood<=2?1:0});
 g.push({id:'swap',t:pick(SWAPS,seedNum()),d:'Healthy swap',core:0});
 g.push({id:'stretch',t:'Flexibility flow (8 min)',d:'Stretching',core:0,open:'w:flex'});
 g.push({id:'sleep',t:'Lights out by '+(c.sleep<=1?'10:30 PM':'11:00 PM'),d:'Screens off 30 min before bed',core:tired?1:0});
 g.push({id:'skin',t:pick(SKIN,seedNum()),d:'Skin-care habit',core:0});

}

 if(!M.plan)return `<div class="card"><h2>Meals for the week</h2><p class="sub">A quick quiz and I'll make a protein-forward, student-friendly plan plus a grocery list. The goal is fueling enough to build muscle and feel energized.</p><button class="btn" data-act="mealQuiz">Plan my meals</button></div>`+fastCard();
 const dn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],sel=window._md===undefined?(new Date().getDay()+6)%7:window._md,d=M.plan[sel];
 const groc=grocery(),secs=[...new Set(groc.map(g=>g[1]))];
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Meal plan</h2><button class="btn sm ghost" data-act="mealQuiz">Redo quiz</button></div>
 <div class="tabs">${dn.map((n,i)=>`<button class="${i===sel?'on':''}" data-md="${i}">${n}</button>`).join('')}</div>
 ${[['Breakfast',d.b],['Lunch',d.l],['Dinner',d.d]].map(([l,m])=>`<div class="meal"><small>${l} · ${m.min} min · ~${m.pro} g protein</small>${m.n}</div>`).join('')}
 <div class="meal"><small>Snack</small>${d.s}</div><p class="sub">≈ ${d.b.pro+d.l.pro+d.d.pro+8} g protein. Dinner makes tomorrow's lunch on alternate days.</p></div>
 <div class="card groc"><h2>Grocery list</h2>${secs.map(s=>`<h3>${s}</h3>`+groc.filter(g=>g[1]===s).map(g=>`<label class="${M.got[g[0]]?'got':''}"><input type="checkbox" data-groc="${g[0]}" ${M.got[g[0]]?'checked':''}><span>${g[0]}</span></label>`).join('')).join('')}</div>`+fastCard();
}
function fastCard(){return `<div class="card"><h2>Better fast-food orders</h2><p class="sub">For the days it's that or nothing — eating something always beats skipping.</p>${FAST.map(f=>`<div class="meal"><small>${f[0]}</small>${f[1]}</div>`).join('')}</div>`}
function grocery(){const map={};S.meals.plan.forEach(d=>{[d.b,d.l,d.d].forEach(m=>m.it.forEach(i=>map[i[0]]=i[1]));(SNACKS.find(s=>s[0]===d.s)||[0,[]])[1].forEach(i=>map[i[0]]=i[1])});
 const order=['Produce','Meat','Deli','Dairy','Bakery','Frozen','Pantry'];return Object.entries(map).sort((a,b)=>order.indexOf(a[1])-order.indexOf(b[1])||a[0].localeCompare(b[0]))}
function mealQuiz(){window._mq={taste:[],time:20,budget:2,no:[]};mealQ()}
function mealQ(){const q=window._mq,tog=(k,v,l)=>`<button class="opt ${q[k].includes(v)?'on':''}" data-mqm="${k}" data-v="${v}">${l}</button>`,one=(k,v,l)=>`<button class="opt ${q[k]==v?'on':''}" data-mq1="${k}" data-v="${v}">${l}</button>`;
 openSheet(`<button class="x" data-act="close">×</button><h2>Meal quiz</h2>
 <h3>Flavors you love</h3><div class="opts">${tog('taste','sweet','Sweet breakfasts')}${tog('taste','savory','Savory')}${tog('taste','spicy','Spicy / Mexican')}</div>
 <h3>Max cooking time</h3><div class="opts">${one('time',10,'≤10 min')}${one('time',20,'≤20 min')}${one('time',30,'≤30 min')}</div>
 <h3>Budget</h3><div class="opts">${one('budget',1,'$ Tight')}${one('budget',2,'$$ Moderate')}${one('budget',3,'$$$ Flexible')}</div>
 <h3>Skip these</h3><div class="opts">${tog('no','fish','Seafood')}${tog('no','meat','Meat (vegetarian)')}${tog('no','spicy','Spicy')}</div>
 <button class="btn" data-act="mealMake">Make my plan</button>`)}
function mealMake(){const q=window._mq;
 const allowed=m=>!q.no.some(t=>t==='meat'?!m.tags.includes('veg'):m.tags.includes(t));
 const score=m=>q.taste.filter(t=>m.tags.includes(t)).length;
 const pool=t=>{let p=MEALS.filter(m=>m.m===t&&allowed(m)&&m.min<=q.time&&m.c<=q.budget);if(p.length<2)p=MEALS.filter(m=>m.m===t&&allowed(m));if(!p.length)p=MEALS.filter(m=>m.m===t);return p.sort((a,b)=>score(b)-score(a))};
 const B=pool('b'),L=pool('l'),D=pool('d'),plan=[];
 for(let i=0;i<7;i++){plan.push({b:B[i%Math.min(B.length,3)],l:i%2?plan[i-1].d:L[(i/2|0)%L.length],d:D[i%D.length],s:SNACKS[i%SNACKS.length][0]})}
 S.meals={prefs:q,plan,got:{}};save();closeSheet();window._md=undefined;go('meals')}

function lastDays(n){const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push([dkey(d),S.days[dkey(d)]])}return a}
function streak(){let s=0;for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);const x=S.days[dkey(d)];const n=x&&x.done?Object.keys(x.done).length:0;if(n>=3)s++;else if(i>0)break}return s}
function chart(series,max,labels){const W=320,H=120,n=labels.length,X=i=>n>1?i*(W-20)/(n-1)+10:W/2;let s=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%">`;
 for(let g=0;g<=2;g++)s+=`<line x1="0" x2="${W}" y1="${10+g*(H-20)/2}" y2="${10+g*(H-20)/2}" stroke="#f1e6e1"/>`;
 series.forEach(([vals,col])=>{const pts=vals.map((v,i)=>v==null?null:[X(i),H-10-v/max*(H-20)]).filter(Boolean);
  s+=`<polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${col}"/>`)});
 labels.forEach((l,i)=>s+=`<text x="${X(i)}" y="${H+14}" font-size="11" text-anchor="middle" fill="#8c7d78">${l}</text>`);return s+'</svg>'}
function bars(vals,max,labels,col){const W=320,H=110,n=vals.length,bw=(W/n)*.6;let s=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%">`;
 vals.forEach((v,i)=>{const h=max?Math.min(1,(v||0)/max)*(H-10):0,x=i*W/n+(W/n-bw)/2;s+=`<rect x="${x}" y="${H-h}" width="${bw}" height="${h}" rx="5" fill="${col}"/><text x="${x+bw/2}" y="${H+14}" font-size="11" text-anchor="middle" fill="#8c7d78">${labels[i]}</text>`});return s+'</svg>'}
function vTrack(){
 const L=lastDays(7),lab=L.map(([k])=>'SMTWTFS'[new Date(k+'T12:00').getDay()]),ci=f=>L.map(([,x])=>x&&x.checkin?x.checkin[f]:null);
 const s=weekStats(),st=streak(),x=day();
 const allW=Object.entries(S.days).flatMap(([k,x])=>(x.workouts||[]).map(w=>[k,w.n])).slice(-8).reverse();
 const wts=Object.entries(S.days).filter(([,x])=>x.weight).slice(-10);
 const done=L.reduce((a,[,x])=>a+(x&&x.done?Object.keys(x.done).length:0),0);
 return `<div class="card"><div class="grid"><div><div class="sub">Streak</div><h1>${st} day${st===1?'':'s'}</h1></div><div><div class="sub">Goals done (7 days)</div><h1>${done}</h1></div></div><p class="sub">A streak day = 3+ goals checked off.</p></div>
 <div class="card"><h3>Weekly summary</h3><p>${s.w} strength · ${s.o} Orangetheory · ${s.walk} walking min · ${s.rest} mobility. ${s.w+s.o>=3?'You\'re building real consistency.':'Every small session counts. Keep showing up.'}</p></div>
 <div class="card"><h3>Energy, mood &amp; skin</h3><div class="row sub" style="gap:14px"><span style="color:#b9786a">● Energy</span><span style="color:#8fa585">● Mood</span><span style="color:#d9a99b">● Skin</span></div>${chart([[ci('energy'),'#b9786a'],[ci('mood'),'#8fa585'],[ci('skin').map(v=>v==null?null:v*4/3),'#d9a99b']],4,lab)}</div>
 <div class="card"><h3>Water (oz)</h3>${bars(L.map(([,x])=>x?x.water:0),96,lab,'#c9b6d6')}<h3>Steps</h3>${bars(L.map(([,x])=>x?x.steps||0:0),8000,lab,'#e9c9bf')}</div>
 <div class="card"><h3>Workout log</h3>${allW.length?allW.map(w=>`<div class="meal"><small>${w[0]}</small>${w[1]}</div>`).join(''):'<p class="sub">Finish a workout and it shows up here.</p>'}</div>
 <div class="card"><h3>Optional body check-in</h3><p class="sub">Totally optional. Strength and energy are the real wins; the scale may barely move as you build muscle.</p>
 <div class="row"><input type="number" step="0.1" id="wtIn" placeholder="Weight (lb)" value="${x.weight||''}"><input type="text" id="msIn" placeholder="Measurements / notes" value="${x.meas||''}"></div><button class="btn ghost" style="margin-top:8px" data-act="saveBody">Save</button>
 ${wts.length>1?chart([[wts.map(w=>w[1].weight-100),'#b9786a']],30,wts.map(w=>w[0].slice(5))):''}</div>
 <button class="btn ghost" data-act="reset">Reset all data</button>`;
}
function openSheet(h){$('#sheet').innerHTML=h;$('#modal').classList.add('on');$('#sheet').scrollTop=0}
function closeSheet(){$('#modal').classList.remove('on');clearInterval(timerInt)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,input[type=checkbox]');if(!b){if(e.target.id==='modal')closeSheet();return}
 const ds=b.dataset;
 if(ds.tab)return go(ds.tab);
 if(ds.goal){const x=day();if(x.done[ds.goal])delete x.done[ds.goal];else x.done[ds.goal]=1;save();return render()}
 if(ds.water){const x=day();x.water=Math.max(0,x.water+ +ds.water);const g=x.goals&&x.goals.find(g=>g.id==='water');if(g&&x.water>=g.oz)x.done.water=1;save();return render()}
 if(ds.open){if(ds.open==='gym')return gymSheet();return startWorkout(ds.open.slice(2))}
 if(ds.move)return moveSheet(ds.move);
 if(ds.mf){mfilter=ds.mf;return render()}
 if(ds.md!==undefined){window._md=+ds.md;return render()}
 if(ds.groc){S.meals.got[ds.groc]=b.checked;save();return render()}
 if(ds.q){Q[ds.q]=+ds.v;return quiz(+ds.i+1)}
 if(ds.pk){window._p[ds.pk]=+ds.v;b.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));return}
 if(ds.mqm){const a=window._mq[ds.mqm],i=a.indexOf(ds.v);if(i<0)a.push(ds.v);else a.splice(i,1);return mealQ()}
 if(ds.mq1){window._mq[ds.mq1]=+ds.v;return mealQ()}
 const A={close:closeSheet,quiz:()=>quiz(0),planEdit,mealQuiz,mealMake,
  planSave:()=>{S.weeks[wkey()]=window._p;save();closeSheet();render()},
  saveSteps:()=>{const x=day();x.steps=+$('#stepsIn').value||0;const g=x.goals&&x.goals.find(g=>g.id==='steps');if(g&&x.steps>=g.steps)x.done.steps=1;save();render()},
  saveBody:()=>{const x=day();x.weight=+$('#wtIn').value||undefined;x.meas=$('#msIn').value;save();render()},
  tStart:()=>tStart(+ds.sec),wNext:()=>wNext(+ds.sets),
  logGym:()=>{const x=day();x.workouts.push({k:'gym',n:'Campus gym',at:Date.now()});if(x.goals&&x.goals.find(g=>g.kind==='gym'))x.done.workout=1;save();closeSheet();render()},
  reset:()=>{if(confirm('Erase all Glow data on this device?')){localStorage.removeItem('glow');location.reload()}}};
 if(ds.act&&A[ds.act])A[ds.act]();
});
nav();render();
</script></body></html>
